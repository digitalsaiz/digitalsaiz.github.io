<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import Questionnaire — Note TCA</title>
  <meta name="description" content="Open this shared questionnaire in the Note TCA app." />
  <meta name="theme-color" content="#4395a6" />
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .import-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: linear-gradient(135deg, #f0f9fb 0%, #e8f4f8 100%);
    }
    .import-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(67,149,166,.18), 0 4px 16px rgba(0,0,0,.04);
      text-align: center;
    }
    .import-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: var(--teal-lt);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 16px;
    }
    .import-card h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .import-card p {
      font-size: 14px;
      color: var(--gray);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--teal);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .open-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(67,149,166,.3); color: #fff; }
    .code-block {
      background: var(--gray-lt);
      border: 1px dashed rgba(67,149,166,.4);
      border-radius: 10px;
      padding: 14px;
      margin: 16px 0 8px;
    }
    .code-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 10px;
      color: var(--gray);
      letter-spacing: .8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .code-value {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 1px;
      word-break: break-all;
    }
    .copy-btn {
      background: transparent;
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .copy-btn:hover { background: var(--teal-lt); }
    .copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }
    .stores {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .stores .store-badge {
      flex: 1;
      min-width: 130px;
      max-width: 180px;
      justify-content: center;
    }
    .help-text {
      font-size: 12px;
      color: var(--gray);
      margin-top: 16px;
      line-height: 1.5;
    }
    .missing {
      background: #fef2f2;
      border-radius: 10px;
      padding: 14px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="import-wrap">
  <div class="import-card">
    <div class="import-icon">📋</div>
    <h1 id="title">Open in Note TCA</h1>
    <p id="subtitle">Tap the button below to import this questionnaire into your Note TCA app.</p>

    <div id="content"></div>
  </div>
</div>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search)
    const token = (params.get('token') || '').trim()
    const content = document.getElementById('content')

    if (!token) {
      content.innerHTML = '<div class="missing">No share token found in the link. Ask the sender to share the link again.</div>'
      return
    }

    const deepLink = 'notetca-ai://questionnaires/import?token=' + encodeURIComponent(token)
    const iosUrl = 'https://apps.apple.com/us/app/note-tca/id6762950386'
    const androidUrl = 'https://play.google.com/store/apps/details?id=com.admintca.note'

    content.innerHTML = `
      <a href="${deepLink}" class="open-btn" id="openBtn">Open in Note TCA →</a>

      <div class="code-block">
        <div class="code-label">Share code</div>
        <div class="code-value" id="codeVal">${token}</div>
        <button class="copy-btn" id="copyBtn" type="button">Copy code</button>
      </div>

      <p class="help-text">
        Don't have Note TCA yet? Install it and open it once, then come back and tap "Open in Note TCA" — or manually paste the code in <strong>Questionnaires → Import</strong>.
      </p>

      <div class="stores">
        <a href="${iosUrl}" class="store-badge" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          <div class="store-badge-text"><small>Download on the</small><span>App Store</span></div>
        </a>
        <a href="${androidUrl}" class="store-badge outline" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path d="M3.18 23.76c.33.18.72.2 1.07.04l12.35-6.96-2.59-2.59-10.83 9.51zM.44 1.54A1.27 1.27 0 0 0 0 2.5v19c0 .4.16.77.44 1.06l.06.06L10.87 12v-.22L.5 1.48l-.06.06zM20.14 10.01l-2.5-1.41-2.89 2.89 2.89 2.89 2.52-1.42c.72-.4.72-1.55-.02-1.95zM4.25.24L16.6 7.2l-2.59 2.59L3.18.28C3.53.12 3.92.14 4.25.24z"/>
          </svg>
          <div class="store-badge-text"><small>Get it on</small><span>Google Play</span></div>
        </a>
      </div>
    `

    // Try to open the app automatically on mobile (where the scheme is registered).
    // We use a small delay so the UI renders first, and listen for visibility
    // change as a signal that the app handover worked.
    function tryAutoOpen() {
      // Only attempt on touch devices — clicking the link manually works fine on desktop.
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      if (!isMobile) return
      // Detect that the page got backgrounded → assume the app opened
      let openedApp = false
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) openedApp = true
      })
      setTimeout(function () {
        if (!openedApp) {
          window.location.href = deepLink
        }
      }, 250)
    }
    tryAutoOpen()

    // Copy button
    document.getElementById('copyBtn').addEventListener('click', function () {
      const btn = this
      navigator.clipboard.writeText(token).then(function () {
        btn.textContent = 'Copied!'
        btn.classList.add('copied')
        setTimeout(function () {
          btn.textContent = 'Copy code'
          btn.classList.remove('copied')
        }, 1500)
      }).catch(function () {
        // Older browsers / no permission — fall back to text selection
        const range = document.createRange()
        range.selectNodeContents(document.getElementById('codeVal'))
        const sel = window.getSelection()
        sel.removeAllRanges()
        sel.addRange(range)
      })
    })
  })()
</script>

</body>
</html>
